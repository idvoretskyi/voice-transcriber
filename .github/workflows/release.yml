---
name: Release

'on':
  # Automatic release when tags are pushed
  push:
    tags:
      - 'v*'

  # Manual release creation
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 1.2.0)'
        required: true
        type: string
      release_type:
        description: 'Type of release'
        required: true
        default: 'minor'
        type: choice
        options:
          - patch
          - minor
          - major
      prerelease:
        description: 'Mark as pre-release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  security-events: write

env:
  GO_VERSION: '1.25.9'

jobs:
  # Manual tag creation (only for workflow_dispatch)
  create-tag:
    name: Create Release Tag
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    outputs:
      tag_name: ${{ steps.tag.outputs.tag_name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate version format
        run: |
          version="${{ github.event.inputs.version }}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ Invalid version format. Use semantic versioning"
            exit 1
          fi

      - name: Check if tag exists
        run: |
          version="${{ github.event.inputs.version }}"
          if git rev-parse "v$version" >/dev/null 2>&1; then
            echo "❌ Tag v$version already exists"
            exit 1
          fi

      - name: Create and push tag
        id: tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          TAG_NAME="v${{ github.event.inputs.version }}"
          git tag -a "${TAG_NAME}" -m "Release ${TAG_NAME}"
          git push origin "${TAG_NAME}"

          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "✅ Created and pushed tag ${TAG_NAME}"

  # Pre-release quality checks
  pre-release-checks:
    name: Pre-release Quality Gate
    runs-on: ubuntu-latest
    needs: [create-tag]
    if: >
      always() &&
      (needs.create-tag.result == 'success' || github.event_name == 'push')
    outputs:
      go-version: ${{ steps.setup.outputs.go-version }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        id: setup
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Extract version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="v${{ github.event.inputs.version }}"
          else
            VERSION=${GITHUB_REF#refs/tags/}
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Cache Go modules
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download and verify dependencies
        run: |
          go mod download
          go mod verify

      - name: Run comprehensive tests
        run: |
          go test -v -race -coverprofile=coverage.out ./...
          go test -v -bench=. -benchmem ./...

      - name: Upload test coverage
        uses: codecov/codecov-action@v7
        if: always()
        with:
          files: ./coverage.out
          flags: unittests
          name: release-coverage
          fail_ci_if_error: false

  # Code quality analysis
  code-quality:
    name: Code Quality Analysis
    runs-on: ubuntu-latest
    needs: [pre-release-checks]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Run linter
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4
          args: --timeout=5m --verbose

      - name: Run Go security scanner
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.25.0
          echo "$HOME/go/bin" >> $GITHUB_PATH
          gosec -fmt sarif -out gosec-results.sarif ./...

      - name: Upload gosec results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: gosec-results.sarif
          category: gosec

  # Security vulnerability scanning
  security-scan:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest
    needs: [pre-release-checks]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Run Go vulnerability check
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.2.0
          echo "$HOME/go/bin" >> $GITHUB_PATH
          govulncheck ./...

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
          category: trivy

  # Build and release with SLSA
  build:
    name: SLSA3 Build (${{ matrix.os }}-${{ matrix.arch }})
    permissions:
      id-token: write  # To sign the provenance.
      contents: write  # To upload assets to release.
      actions: read   # To read the workflow path.
    uses: >-
      slsa-framework/slsa-github-generator/.github/workflows/builder_go_slsa3.yml@v2.1.0
    needs: [pre-release-checks, code-quality, security-scan]
    strategy:
      matrix:
        os: [linux, darwin]
        arch: [amd64, arm64]
    with:
      go-version: '1.25.9'
      config-file: .slsa-goreleaser/${{ matrix.os }}-${{ matrix.arch }}.yml
      evaluated-envs: >-
        VERSION:${{ needs.pre-release-checks.outputs.version ||
        github.ref_name }}

  # Upload binaries to release
  upload:
    name: Upload Assets
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: write

    steps:
      - name: Extract release metadata
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="v${{ github.event.inputs.version }}"
            PRERELEASE="${{ github.event.inputs.prerelease }}"
            RELEASE_TYPE="${{ github.event.inputs.release_type }}"
          else
            VERSION=${GITHUB_REF#refs/tags/}
            # Per semver, any tag containing '-' is a pre-release (e.g. v0.1.0-alpha.1)
            if [[ "$VERSION" == *-* ]]; then
              PRERELEASE="true"
            else
              PRERELEASE="false"
            fi
            RELEASE_TYPE="release"
          fi

          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "release-name=Voice Transcriber ${VERSION}" >> \
            $GITHUB_OUTPUT
          echo "prerelease=${PRERELEASE}" >> $GITHUB_OUTPUT
          echo "release-type=${RELEASE_TYPE}" >> $GITHUB_OUTPUT

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: voice-transcriber-*
          merge-multiple: true
          path: ./artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.version }}
          name: ${{ steps.meta.outputs.release-name }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          generate_release_notes: true
          body: |
            ## Voice Transcriber ${{ steps.meta.outputs.version }}

            🔒 **SLSA3 Compliant Release** - This release includes
            cryptographic provenance attestations for supply chain security.

            ### Installation

            **Quick Install:**
            ```bash
            # Linux/macOS
            VERSION=${{ steps.meta.outputs.version }}
            curl -L -o voice-transcriber \
              "https://github.com/idvoretskyi/voice-transcriber/releases/download/${VERSION}/voice-transcriber-linux-amd64"
            chmod +x voice-transcriber
            ```

            **Available Platforms:**
            - Linux (x64, ARM64)
            - macOS (Intel, Apple Silicon)

            ### Setup

            1. Install FFmpeg: `brew install ffmpeg` (macOS) or
               `apt install ffmpeg` (Ubuntu)
            2. Set up authentication: `gcloud auth application-default login`
            3. Set GCP project: `gcloud config set project YOUR_PROJECT_ID`

            ### Usage

            ```bash
            # Transcribe with automatic language detection (default)
            ./voice-transcriber transcribe video.mp4

            # Specify language explicitly
            ./voice-transcriber transcribe video.mp4 --language uk
            ```

            ### Security

            This release includes SLSA3 provenance attestations.
            You can verify the integrity using:
            ```bash
            # Verify with slsa-verifier
            slsa-verifier verify-artifact --provenance-path <provenance-file> \
              --source-uri github.com/${{ github.repository }} <binary>
            ```
          files: |
            ./artifacts/**/*

      - name: Generate release summary
        if: always()
        run: |
          echo "## SLSA3 Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ steps.meta.outputs.version }}" >> \
            $GITHUB_STEP_SUMMARY
          echo "**Release Name:** ${{ steps.meta.outputs.release-name }}" >> \
            $GITHUB_STEP_SUMMARY
          echo "**Type:** ${{ steps.meta.outputs.release-type }}" >> \
            $GITHUB_STEP_SUMMARY
          echo "**Pre-release:** ${{ steps.meta.outputs.prerelease }}" >> \
            $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "**Go Version:** ${{ env.GO_VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "**Security:** SLSA3 Compliant ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔒 Security Features" >> $GITHUB_STEP_SUMMARY
          echo "- SLSA3 provenance attestations included" >> \
            $GITHUB_STEP_SUMMARY
          echo "- Cryptographic signatures for supply chain verification" >> \
            $GITHUB_STEP_SUMMARY
          echo "- Immutable build environment with GitHub-hosted runners" >> \
            $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- Multi-platform binaries (Linux, macOS)" >> \
            $GITHUB_STEP_SUMMARY
          echo "- Provenance files for each binary" >> $GITHUB_STEP_SUMMARY
          echo "- Checksums and signatures" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔗 Links" >> $GITHUB_STEP_SUMMARY
          REPO="${{ github.repository }}"
          VERSION="${{ steps.meta.outputs.version }}"
          RELEASE_URL="https://github.com/${REPO}/releases/tag/${VERSION}"
          echo "- [GitHub Release](${RELEASE_URL})" >> $GITHUB_STEP_SUMMARY
          echo "- [SLSA Framework](https://slsa.dev/)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

  # Post-release verification
  post-release:
    name: Post-release Verification
    runs-on: ubuntu-latest
    needs: [upload]
    if: always()

    steps:
      - name: Verify release artifacts
        run: |
          echo "Verifying release artifacts..."
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG_NAME="v${{ github.event.inputs.version }}"
          else
            TAG_NAME=${GITHUB_REF#refs/tags/}
          fi

          REPO="${{ github.repository }}"
          API_URL="https://api.github.com/repos/${REPO}/releases/tags"
          curl -s "${API_URL}/${TAG_NAME}" | jq -r '.assets[].name'

      - name: Notify success
        if: success()
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="v${{ github.event.inputs.version }}"
          else
            VERSION=${GITHUB_REF#refs/tags/}
          fi

          echo "🎉 Release ${VERSION} completed successfully!"
          echo "📦 All artifacts have been built and published"
          REPO="${{ github.repository }}"
          URL="https://github.com/${REPO}/releases/tag/${VERSION}"
          echo "🔗 Release URL: ${URL}"

      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Release failed! Check the logs above for details."
          echo "Common issues:"
          echo "- Missing secrets (GITHUB_TOKEN)"
          echo "- SLSA builder configuration errors"
          echo "- Test failures or security vulnerabilities"
